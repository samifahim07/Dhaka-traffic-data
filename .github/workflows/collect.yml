name: Collect Dhaka Traffic Data

on:
  schedule:
    # Runs every 15 minutes (UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # allows manual trigger from the Actions tab

permissions:
  contents: write  # needed to commit the csv back to the repo

env:
  # Set this once to the date you started/want to start collecting (YYYY-MM-DD).
  START_DATE: "2026-09-25"
  # How many days to keep running before the job auto-stops doing work.
  RUN_DAYS: 10

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check if within run window
        id: window
        run: |
          start_epoch=$(date -d "$START_DATE" +%s)
          end_epoch=$((start_epoch + RUN_DAYS * 86400))
          now_epoch=$(date -u +%s)
          if [ "$now_epoch" -ge "$end_epoch" ]; then
            echo "10-day collection window has ended. Skipping run."
            echo "in_window=false" >> "$GITHUB_OUTPUT"
          else
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.window.outputs.in_window == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.window.outputs.in_window == 'true'
        run: pip install requests

      - name: Run traffic collector
        if: steps.window.outputs.in_window == 'true'
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python collect_traffic.py

      - name: Commit and push updated CSV
        if: steps.window.outputs.in_window == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic_data.csv
          git diff --staged --quiet || git commit -m "Update traffic_data.csv [automated]"
          git push
